# Build the Vite app and deploy the compiled output to GitHub Pages.
#
# IMPORTANT (one-time setup): in the repository go to
#   Settings > Pages > Build and deployment > Source = "GitHub Actions"
# Otherwise this workflow cannot publish (Pages would still serve a branch).
#
# After that, every push/merge to `main` (or a manual run) rebuilds and
# redeploys the site automatically. `base` in vite.config.js already matches the
# project site path '/Iot_carrito_aws_frontend/'.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # GitHub Pages serves from a sub-path, so define the base here.
          VITE_BASE: /Iot_carrito_aws_frontend/
          # Empty by default -> the deployed site runs in simulated demo mode.
          # Define repository variables (Settings > Secrets and variables >
          # Actions > Variables) to point at a real backend.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
